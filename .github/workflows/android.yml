name: Android APK

on:
  push:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TOOLS_VERSION: 34.0.0
      PLATFORM: android-34
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "build-tools;$BUILD_TOOLS_VERSION" "platforms;$PLATFORM" > /dev/null

      # Optional stable signing key: set repo secrets ANDROID_KEYSTORE_BASE64 (base64 of a
      # PKCS12/JKS keystore), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      # Without them a throwaway debug keystore is generated (APKs from different runs won't
      # install over each other without uninstalling first).
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Using keystore from secrets"
          else
            echo "No keystore secret; build.js will generate a debug keystore"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node mobile/android/build.js

      - name: Inspect APK
        run: |
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          "$BT/aapt2" dump badging mobile/android/build/SessionSwitcher.apk | head -n 8
          "$BT/apksigner" verify --print-certs mobile/android/build/SessionSwitcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SessionSwitcher-apk
          path: mobile/android/build/SessionSwitcher.apk
          if-no-files-found: error
