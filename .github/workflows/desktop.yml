name: Desktop app

# A version tag (v6.3.0, or v6.3.0-beta.1 for a test version: made by `node desktop/release.js`)
# runs every test on Windows and on a Mac first; only if they all pass does it build the Windows
# installer and the Mac apps and publish them as a GitHub release. Installed copies update from it.
# A test version is published as a pre-release: only copies set to get test versions take it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # (Windows takes 42 to 49 minutes now, depending on the machine GitHub lends.)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the tests
        run: node tests/run.js
        env:
          SHOTS: shots
      - name: Keep the screenshots if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: shots

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the app's version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APP=$(node -p "require('./desktop/package.json').version")
          SRV=$(grep -oP "APP_VERSION = '\K[^']+" server.js)
          echo "tag $TAG, desktop $APP, server $SRV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && { [ "$TAG" != "$APP" ] || [ "$TAG" != "$SRV" ]; }; then echo "Versions differ"; exit 1; fi
      - name: Prepare the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRE=""; case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --draft $PRE --title "Session Switcher ${GITHUB_REF_NAME#v}" --notes-file docs/whats-new.md

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Build and publish
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: 'true'
          # Not signed with a certificate: shared with people who know where it's from. (The Mac
          # app gets a free ad-hoc signature, which Apple-silicon Macs need to open it at all.)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.os == 'windows-latest' && '--win' || '--mac' }} --publish ${{ github.ref_type == 'tag' && 'always' || 'never' }}
      - name: Keep the build (runs without a tag)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.yml

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Publish once both platforms can update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          channel=latest
          if [[ "$version" == *-* ]]; then pre="${version#*-}"; channel="${pre%%.*}"; fi
          release=$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets,isDraft)
          assets=$(jq -r '.assets[] | select(.state == "uploaded" and .size > 0) | .name' <<<"$release")
          files=("$channel.yml" "$channel-mac.yml" "SessionSwitcher-$version-win-x64.exe")
          for arch in arm64 x64; do
            files+=("SessionSwitcher-$version-mac-$arch.zip" "SessionSwitcher-$version-mac-$arch.dmg")
          done
          for file in "${files[@]}"; do
            grep -Fxq -- "$file" <<<"$assets" || { echo "Missing release asset: $file"; exit 1; }
            if [[ "$file" != *.yml ]]; then
              grep -Fxq -- "$file.blockmap" <<<"$assets" || { echo "Missing blockmap: $file"; exit 1; }
            fi
          done
          if [[ $(jq -r '.isDraft' <<<"$release") == true ]]; then gh release edit "$tag" -R "$GITHUB_REPOSITORY" --draft=false; fi
