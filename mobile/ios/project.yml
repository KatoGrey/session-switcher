# Session Switcher for iPhone: a small remote for the Session Switcher running on your computer.
# Generate the Xcode project with:  xcodegen   (brew install xcodegen)
name: SessionSwitcher
options:
  bundleIdPrefix: com.sessionswitcher
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "5.4.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set this to your Apple developer team (Xcode → Settings → Accounts) to run on your iPhone.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  SessionSwitcher:
    type: application
    platform: iOS
    sources: [SessionSwitcher]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sessionswitcher.remote
        PRODUCT_NAME: Switcher
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Switcher
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Switcher connects to Session Switcher on your computer over your Wi-Fi."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take photos and videos to attach to a chat."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Record sound with videos you attach to a chat."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Attach photos and videos to a chat."
    info:
      path: SessionSwitcher/Info.plist
      properties:
        # Session Switcher serves plain http on your own network (or Tailscale, which encrypts it).
        # Only NSAllowsArbitraryLoads: with any narrower ATS key present, iOS ignores it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
