name: SwitcherLite
options:
  bundleIdPrefix: com.ryanseamons
  deploymentTarget:
    iOS: "17.0"
targets:
  SwitcherLite:
    type: application
    platform: iOS
    sources: [SwitcherLite]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanseamons.switcherlite
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Switcher
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
  SwitcherLiteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SwitcherLiteUITests]
    dependencies:
      - target: SwitcherLite
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanseamons.switcherlite.uitests
        TEST_TARGET_NAME: SwitcherLite
schemes:
  SwitcherLite:
    build:
      targets:
        SwitcherLite: all
        SwitcherLiteUITests: [test]
    test:
      targets: [SwitcherLiteUITests]
