<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Switcher</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18.5' fill='%234a1d1a' stroke='%23a5463f' stroke-width='2'/%3E%3Cpath d='M20 4.5L23.2 16.8L35.5 20L23.2 23.2L20 35.5L16.8 23.2L4.5 20L16.8 16.8Z' fill='%23ede6d9'/%3E%3Ccircle cx='20' cy='20' r='2.8' fill='%23a5463f'/%3E%3C/svg%3E">
<link rel="preload" href="/fonts/spectral-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/playfair.woff2" as="font" type="font/woff2" crossorigin>
<meta name="theme-color" content="#0a090c">
<link rel="stylesheet" href="/styles.css">
<script src="/theme.js"></script>
<script>window.TOKEN = '__TOKEN__'; window.REMOTE = __REMOTE__;</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gFive" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:rgb(var(--c-d68a7c))"/><stop offset="1" style="stop-color:rgb(var(--c-a5463f))"/></linearGradient>
    <linearGradient id="gWeek" x1="0" y1="1" x2="1" y2="0"><stop offset="0" style="stop-color:rgb(var(--c-7d1513))"/><stop offset="1" style="stop-color:rgb(var(--c-94423b))"/></linearGradient>
    <symbol id="sigil" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="18.5" style="fill:rgb(var(--c-3d1a18));stroke:rgb(var(--c-a5463f))" stroke-width="1.6"/>
      <circle cx="20" cy="20" r="14" fill="none" style="stroke:rgb(var(--c-cf8274))" stroke-opacity=".35" stroke-width=".9" stroke-dasharray="1.4 2.6"/>
      <path d="M20 4.5L23.2 16.8L35.5 20L23.2 23.2L20 35.5L16.8 23.2L4.5 20L16.8 16.8Z" style="fill:rgb(var(--c-f6efe3))"/>
      <circle cx="20" cy="20" r="2.8" style="fill:rgb(var(--c-a5463f))"/>
    </symbol>
  </defs>
</svg>

<div class="petals" id="petals" aria-hidden="true"></div>

<header class="bar">
  <button class="icon navtoggle" id="navToggle" aria-label="Show folders and views" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  <button class="brand" id="brand" title="Overview">
    <svg class="sigil" width="38" height="38" aria-hidden="true"><use href="#sigil"/></svg>
    <span class="wordmark"><b>Session Switcher</b><small>Claude &amp; Codex, every chat and account in one place</small></span>
  </button>
  <button class="pulse" id="pulse" title="What’s running right now"></button>
  <button class="usechip" id="usechip" aria-haspopup="true" aria-expanded="false" hidden></button>
<div class="acctpop" id="acctPop" role="dialog" aria-label="Your accounts" hidden></div>
  <span class="spacer"></span>
  <button class="seek" id="seek" aria-label="Jump to a chat, folder or action (Ctrl+K)"><span class="glyph" aria-hidden="true">✦</span><span class="s-t">Search every chat…</span><kbd class="kbd">Ctrl K</kbd></button>
  <button class="icon setupbtn" id="setupBtn" aria-label="Setup and health"><svg width="19" height="19" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.6l1.4 2.1 2.5-.5.5 2.5 2.1 1.4-1.2 2.2 1.2 2.2-2.1 1.4-.5 2.5-2.5-.5L10 17.4l-1.4-2.1-2.5.5-.5-2.5-2.1-1.4L4.7 9.7 3.5 7.5l2.1-1.4.5-2.5 2.5.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span class="hdot" id="hdot"></span></button>
</header>

<div class="shell">
  <nav class="nav" id="nav" aria-label="Views and folders"></nav>
  <main class="page" id="page"></main>
</div>

<aside id="drawer" class="drawer" hidden aria-label="Chat details" tabindex="-1"></aside>
<div id="menu" class="menu" role="menu" hidden></div>

<section id="chat" class="chat" hidden aria-labelledby="cTitle">
  <aside class="rail" id="cRail" aria-label="Running chats">
    <div class="rail-top"><button type="button" class="rail-back" data-c="back"><span class="glyph" aria-hidden="true">✦</span>All chats</button></div>
    <div class="nav-h">Running now <span class="count" id="cRailCount"></span></div>
    <ul class="rail-list" id="cRailList"></ul>
    <div class="rail-keys">Alt+↑ and Alt+↓ switch chats<br>Ctrl+K jumps anywhere</div>
  </aside>
  <div class="c-main">
    <header class="c-head">
      <button type="button" class="icon c-backm" data-c="rail" aria-label="Show running chats"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <div class="c-titles"><p class="eyebrow c-folder" id="cFolder"></p><h1 class="c-title" id="cTitle"></h1></div>
      <div class="c-meta">
        <span class="c-acct" id="cAcct"></span>
        <span class="c-state" id="cState" aria-live="polite"></span>
        <label class="sr" for="cMode">What Claude may do without asking</label>
        <select id="cMode" class="c-mode" title="What Claude may do without asking"></select>
      </div>
      <div class="c-icons">
      <button type="button" class="icon" data-c="ledger" aria-label="Show or hide the ledger" title="Ledger: artifacts, files, commands and tasks"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="2.5" width="12" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 6h6M6 9h6M6 12h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      <button type="button" class="icon" data-c="more" aria-haspopup="menu" aria-expanded="false" aria-label="More chat actions"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="4" cy="9" r="1.5" fill="currentColor"/><circle cx="9" cy="9" r="1.5" fill="currentColor"/><circle cx="14" cy="9" r="1.5" fill="currentColor"/></svg></button>
      </div>
    </header>
    <div class="c-scroll" id="cScroll"><div class="c-feed" id="cFeed"></div></div>
    <div class="c-dock">
      <div class="c-pending" id="cPending" aria-live="polite"></div>
      <form class="c-compose" id="cCompose">
        <div class="c-slash" id="cSlash" role="listbox" aria-label="Saved prompts" hidden></div>
        <div class="c-pick" id="cPick" role="dialog" aria-label="Model and effort" hidden></div>
        <div class="c-box">
          <div class="c-att" id="cAtt" hidden></div>
          <textarea id="cText" rows="1" placeholder="Write to Claude…" aria-label="Message Claude"></textarea>
          <div class="c-row">
            <div class="c-crew" id="cCrew" role="group" aria-label="Who your message goes to"></div>
            <button type="button" class="btn quiet sm c-ib" data-c="attach" title="Attach files. Pictures go straight to the chat; videos, PDFs and other files are saved in the project’s attachments folder for it to open. You can also paste or drop them." aria-label="Attach files"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 4.5 5.4 9.6a1.5 1.5 0 0 0 2.1 2.1l5.4-5.4a3 3 0 0 0-4.2-4.2L3.3 7.5a4.5 4.5 0 0 0 6.4 6.4l4.1-4.1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Attach</span></button>
            <button type="button" class="btn quiet sm c-ib" data-c="prompts" aria-haspopup="menu" aria-expanded="false" title="Insert a saved prompt. You can also type / in an empty message box." aria-label="Prompts"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.5h10M3 8h10M3 12.5h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span>Prompts</span></button>
            <input type="file" id="cFile" multiple hidden>
            <span class="typing" id="cTyping" hidden aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="c-status" id="cStatus" aria-live="polite"></span>
            <span class="spacer"></span>
            <span class="c-model" id="cModel" hidden></span>
            <button type="button" class="btn sm" id="cStop" data-c="stop" hidden title="Stop Claude (Esc)">Stop</button>
            <button type="submit" class="btn prime sm" id="cSend">Send</button>
          </div>
        </div>
        <p class="c-hint" id="cHint">Enter sends · Shift+Enter new line · / prompts · <b>/model</b> switches model · Esc stops</p>
      </form>
      <div class="watchbar" id="cWatch" hidden></div>
    </div>
  </div>
  <aside class="ledger" id="cLedger" aria-label="Ledger"></aside>
  <div class="lightbox" id="cLight" hidden tabindex="-1"><img alt="Full-size image"></div>
</section>

<div class="palette" id="palette" hidden role="dialog" aria-modal="true" aria-label="Jump to">
  <div class="pal-box">
    <div class="pal-in"><span class="glyph" aria-hidden="true">✦</span><input id="palQ" autocomplete="off" spellcheck="false" placeholder="Jump to a chat, folder or action…" role="combobox" aria-controls="palList" aria-expanded="true"></div>
    <ul class="pal-list" id="palList" role="listbox"></ul>
    <p class="pal-foot"><span>↑ ↓ move</span><span>Enter open</span><span>Esc close</span></p>
  </div>
</div>

<dialog id="dlg">
  <form method="dialog">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText"></p>
    <input id="dlgInput" maxlength="40" autocomplete="off">
    <div class="d-row"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn prime" value="ok" id="dlgOk"></button></div>
  </form>
</dialog>

<dialog id="setup" class="wide" aria-labelledby="setupTitle">
  <div class="setup-head"><h3 id="setupTitle">Setup</h3><div class="stabs" role="tablist" aria-label="Setup sections"><button role="tab" data-stab="health" aria-selected="true">Options</button><button role="tab" data-stab="look" aria-selected="false">Appearance</button></div><button class="icon" id="setupClose" aria-label="Close">✕</button></div>
  <div class="setup-body" id="setupBody"><p class="loading">Checking…</p></div>
</dialog>

<button class="livepill" id="livepill" aria-haspopup="menu" aria-expanded="false" title="Live updates and alerts"><span class="lp-seal" aria-hidden="true">✦</span><span class="lp-text" id="lpText">Connecting</span><span class="lp-bell" id="lpBell"></span></button>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
<script src="/chat-ui.js"></script>
</body>
</html>
